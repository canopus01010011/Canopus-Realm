<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula — Notes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="app-shell">

        <header class="app-header">
            <div class="brand">
                <span class="brand-mark"><i class="fas fa-star"></i></span>
                <div>
                    <h1>Nebula</h1>
                    <p class="brand-sub">scattered thoughts, gathered</p>
                </div>
            </div>
            <div class="account-chip" id="accountChip">
                <span class="account-dot" id="accountDot"></span>
                <span id="accountLabel">Checking session…</span>
            </div>
        </header>

        <div class="guest-banner" id="guestBanner" hidden>
            <i class="fas fa-circle-info"></i>
            <span>You're browsing as a guest — notes are saved on this device only. Log in from the Realm home page to
                sync them to your account.</span>
        </div>

        <section class="toolbar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search notes…">
            </div>
            <div class="color-filter" id="colorFilter">
                <button class="color-dot active" data-color="all" title="All notes"><i
                        class="fas fa-asterisk"></i></button>
                <button class="color-dot" data-color="emerald" title="Emerald"></button>
                <button class="color-dot" data-color="cyan" title="Cyan"></button>
                <button class="color-dot" data-color="violet" title="Violet"></button>
                <button class="color-dot" data-color="pink" title="Pink"></button>
                <button class="color-dot" data-color="amber" title="Amber"></button>
            </div>
            <button class="new-note-btn" id="newNoteBtn"><i class="fas fa-plus"></i> New note</button>
        </section>

        <section class="composer" id="composer">
            <input type="text" id="note-title" placeholder="Title" maxlength="80">
            <textarea id="note-input" placeholder="Write your note here…" maxlength="4000"></textarea>
            <div class="composer-footer">
                <div class="color-picker" id="colorPicker">
                    <button class="color-dot active" data-color="emerald"></button>
                    <button class="color-dot" data-color="cyan"></button>
                    <button class="color-dot" data-color="violet"></button>
                    <button class="color-dot" data-color="pink"></button>
                    <button class="color-dot" data-color="amber"></button>
                </div>
                <span class="char-count" id="charCount">0 / 4000</span>
                <div class="composer-actions">
                    <button id="cancel-btn" class="ghost-btn">Cancel</button>
                    <button id="add-btn">Save note</button>
                </div>
            </div>
        </section>

        <div id="notes-container" class="notes-grid"></div>

        <div class="empty-state" id="emptyState" hidden>
            <div class="empty-orb"></div>
            <h3>No notes yet</h3>
            <p id="emptyStateText">Tap "New note" to pin your first thought to the sky.</p>
        </div>

    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
