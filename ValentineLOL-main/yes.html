<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Best Decision Ever 💖
    </title>

    <link rel="icon" href="icon.jpg" type="image/jpg">

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="celebration.css">

</head>

<body>

    <div class="hearts"></div>

    <main class="celebration">

        <div class="celebration-card">



            <div class="bears">

                <img src="bears3.gif" alt="Cute bears">

                <img src="bears4.gif" alt="Cute bears">

            </div>

            <h1>
                💘 Best Decision Ever 💘
            </h1>

            <h2>
                I Love You
            </h2>

            <p class="message">
                Our date is officially planned.
                Now all that's left is making
                the memories. ❤️
            </p>

            <div class="celebration-actions">

                <button onclick="window.location.href='index.html'">
                    💌 Plan Again
                </button>

                <button id="viewPlan">
                    📋 View Our Plan
                </button>

            </div>

        </div>

    </main>

    <audio id="celebrationMusic" autoplay loop>

        <source src="song2.mp3" type="audio/mpeg">

    </audio>

    <script>

        const music =
            document.getElementById(
                "celebrationMusic"
            );

        document.addEventListener(
            "click",
            () => {

                if (music.paused) {

                    music.play()
                        .catch(() => { });

                }

            },
            { once: true }
        );


        const hearts =
            document.querySelector(".hearts");


        function createHeart() {

            const heart =
                document.createElement("span");


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.animationDuration =
                Math.random() * 3 + 5 + "s";


            hearts.appendChild(
                heart
            );


            setTimeout(
                () => heart.remove(),
                8000
            );

        }


        setInterval(
            createHeart,
            350
        );


        document
            .getElementById("viewPlan")
            .addEventListener(
                "click",
                () => {

                    const plan =
                        localStorage.getItem(
                            "valentinePlan"
                        );

                    if (plan) {

                        alert(
                            "Your Valentine's plan is safely saved in this browser. 💖"
                        );

                    }

                }
            );

    </script>

</body>

</html>
