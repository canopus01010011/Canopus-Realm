<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>She Said YES 💖</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ff4d6d, #b30059);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
        }
        .gif-wrapper {
    width: 120px;
    margin: 0 auto;
    pointer-events: none;
    user-select: none;
}
#gif1{
    height: 130px;
    width: 100px;
}
#gif2{
    height: 100px;
    width: 100px;
}


.hearts span {
    position: absolute;
    bottom: -40px;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(-45deg);
    animation: floatHeart linear forwards;
    border-radius: 0 50% 50% 0;
}

.hearts span::before,
.hearts span::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
}

.hearts span::before {
    top: -10px;
    left: 0;
}

.hearts span::after {
    top: 0;
    left: 10px;
}

@keyframes floatHeart {
    0% {
        transform: rotate(-45deg) translateY(0) scale(0.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: rotate(-45deg) translateY(-100vh) scale(1);
        opacity: 0;
    }
}

    </style>
        <link rel="icon" href="icon.jpg" type="image/jpg">

</head>

<body>
    <div class="hearts"></div>

    <img id="gif1" src="bears3.gif">
    <h1>💘 Best Decision Ever 💘<br>I Love You</h1>
    <img id="gif2" src="bears4.gif">

    <audio autoplay loop>
        <source src="song2.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <script src="hearts.js"></script>
</body>
<script>const heartsContainer = document.querySelector(".hearts");

    function createHeart() {
        const heart = document.createElement("span");

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDuration = (Math.random() * 3 + 5) + "s";

        heartsContainer.appendChild(heart);

        setTimeout(() => heart.remove(), 8000);
    }

    setInterval(createHeart, 400);
</script>
</html>
