<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe - Coin Flip Edition</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 1rem;
            color: #facc15;
        }

        .players {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .players input {
            padding: 0.5rem;
            border-radius: 6px;
            border: none;
            width: 150px;
        }

        .players button {
            padding: 0.5rem 1rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .coin {
            margin: 2rem auto;
            width: 80px;
            height: 80px;
            background: gold;
            border-radius: 50%;
            line-height: 80px;
            font-weight: bold;
            animation: none;
        }

        @keyframes flip {
            0% {
                transform: rotateY(0);
            }

            50% {
                transform: rotateY(180deg);
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            justify-content: center;
            margin: 2rem auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .cell:hover {
            background: #374151;
        }

        .X {
            color: red;
        }

        .O {
            color: blue;
        }

        .scoreboard {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 1.2rem;
        }

        .winner {
            margin-top: 1rem;
            font-size: 1.5rem;
            color: #22c55e;
        }

        button#restart {
            margin-top: 2rem;
            padding: 0.5rem 1.5rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Tic Tac Toe - Coin Flip Edition</h1>

    <div class="players">
        <div>
            <input id="player1" type="text" placeholder="Player 1 (X)">
        </div>
        <div>
            <input id="player2" type="text" placeholder="Player 2 (O)">
        </div>
        <button onclick="startGame()">Start</button>
    </div>

    <div class="coin" id="coin">🎲</div>
    <div class="winner" id="turnInfo"></div>

    <div class="game-board" id="gameBoard"></div>

    <div class="scoreboard">
        <div id="p1Score">Player 1: 0</div>
        <div id="p2Score">Player 2: 0</div>
    </div>

    <button id="restart" onclick="resetBoard()">Restart Game</button>

    <script>
        let currentPlayer = 'X';
        let board = Array(9).fill('');
        let scores = { X: 0, O: 0 };
        let playerNames = { X: "Player 1", O: "Player 2" };

        const gameBoard = document.getElementById("gameBoard");
        const turnInfo = document.getElementById("turnInfo");
        const coin = document.getElementById("coin");

        function startGame() {
            const p1 = document.getElementById("player1").value.trim();
            const p2 = document.getElementById("player2").value.trim();
            if (p1) playerNames.X = p1;
            if (p2) playerNames.O = p2;

            flipCoin();
        }

        function flipCoin() {
            coin.style.animation = "flip 1s ease-in-out";
            coin.innerText = "🎲";

            setTimeout(() => {
                currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
                coin.innerText = currentPlayer;
                turnInfo.innerText = `${playerNames[currentPlayer]}'s turn (${currentPlayer})`;
                coin.style.animation = "none";
                initBoard();
            }, 1000);
        }

        function initBoard() {
            board = Array(9).fill('');
            gameBoard.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('onclick', `makeMove(this, ${i})`);
                gameBoard.appendChild(cell);
            }
        }

        function makeMove(cell, index) {
            if (board[index] !== '') return;

            board[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add(currentPlayer);

            if (checkWin()) {
                turnInfo.innerText = `${playerNames[currentPlayer]} wins! 🎉`;
                scores[currentPlayer]++;
                updateScore();
                disableBoard();
            } else if (board.every(cell => cell !== '')) {
                turnInfo.innerText = `It's a draw! 🤝`;
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                turnInfo.innerText = `${playerNames[currentPlayer]}'s turn (${currentPlayer})`;
            }
        }

        function checkWin() {
            const wins = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            return wins.some(combo => {
                const [a, b, c] = combo;
                return board[a] === currentPlayer && board[a] === board[b] && board[a] === board[c];
            });
        }

        function disableBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => c.onclick = null);
        }

        function resetBoard() {
            turnInfo.innerText = `${playerNames[currentPlayer]}'s turn (${currentPlayer})`;
            initBoard();
        }

        function updateScore() {
            document.getElementById('p1Score').innerText = `${playerNames.X}: ${scores.X}`;
            document.getElementById('p2Score').innerText = `${playerNames.O}: ${scores.O}`;
        }
    </script>
</body>

</html>
