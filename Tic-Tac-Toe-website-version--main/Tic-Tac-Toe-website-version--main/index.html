<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Canopus Realm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Starfield Background -->
    <canvas id="starfield"></canvas>
    
    <!-- Cursor Glow Effect -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- Mode Selection -->
    <div id="modeSelector" class="mode-selector active">
        <div class="mode-container">
            <h1 class="mode-title">Tic Tac Toe Arena</h1>
            <p class="mode-subtitle">Choose your battle mode</p>
            
            <div class="mode-buttons">
                <button class="mode-btn mode-btn-normal" onclick="selectMode('normal')">
                    <i class="fas fa-chess-pawn"></i>
                    <span>Normal Mode</span>
                    <small>1v1 Casual Play</small>
                </button>
                <button class="mode-btn mode-btn-competition" onclick="selectMode('competition')">
                    <i class="fas fa-trophy"></i>
                    <span>Competition Mode</span>
                    <small>Tournament Style</small>
                </button>
            </div>
        </div>
    </div>

    <!-- Normal Mode Setup -->
    <div id="normalSetup" class="setup-panel hidden">
        <div class="setup-container">
            <button class="back-btn" onclick="backToMode()"><i class="fas fa-arrow-left"></i> Back</button>
            <h2>Normal Mode Setup</h2>
            
            <div class="setup-form">
                <div class="form-group">
                    <label for="normalPlayer1">Player 1 Name</label>
                    <input type="text" id="normalPlayer1" placeholder="Enter your name..." maxlength="20">
                </div>
                <div class="form-group">
                    <label for="normalPlayer2">Player 2 Name</label>
                    <input type="text" id="normalPlayer2" placeholder="Enter player 2 name..." maxlength="20">
                </div>
            </div>
            
            <button class="start-btn" onclick="startNormalMode()">
                <i class="fas fa-play"></i> Start Game
            </button>
        </div>
    </div>

    <!-- Competition Mode Setup -->
    <div id="competitionSetup" class="setup-panel hidden">
        <div class="setup-container">
            <button class="back-btn" onclick="backToMode()"><i class="fas fa-arrow-left"></i> Back</button>
            <h2>Competition Mode Setup</h2>
            
            <div class="setup-form">
                <div class="form-group">
                    <label for="numPlayers">Number of Players (2-8)</label>
                    <input type="number" id="numPlayers" min="2" max="8" value="4" onchange="updatePlayerInputs()">
                </div>
                <div class="form-group">
                    <label for="numMatches">Number of Matches (odd number, min 3)</label>
                    <input type="number" id="numMatches" min="3" step="2" value="3">
                </div>

                <div class="player-input-wrapper">
                    <button class="scroll-btn" id="scrollUp">
                        <i class="fas fa-chevron-up"></i>
                    </button>
                
                <div id="playerInputsContainer" class="player-inputs">
                    <!-- Dynamically generated -->
                </div>
            <button class="scroll-btn" id="scrollDown">
                <i class="fas fa-chevron-down"></i>
            </button>
            </div>
            </div>
            <button class="start-btn" onclick="startCompetitionMode()">
                <i class="fas fa-crown"></i> Start Tournament
            </button>
        </div>
    </div>

    <!-- Normal Mode Game -->
    <div id="normalGameContainer" class="game-container hidden">
        <div class="game-header">
            <button class="back-btn" onclick="exitGame()"><i class="fas fa-times"></i></button>
            <h1>Tic Tac Toe</h1>
            <div class="mode-badge">Normal Mode</div>
        </div>

        <div class="normal-game-content">
            <div class="game-info">
                <div class="current-turn">
                    <span id="normalCurrentTurn"></span>
                </div>
                <div class="scoreboard">
                    <div class="score-item" id="score1"></div>
                    <div class="score-item" id="score2"></div>
                </div>
            </div>

            <div class="game-board" id="normalGameBoard"></div>

            <button class="new-round-btn" onclick="resetNormalGame()">
                <i class="fas fa-redo"></i> New Round
            </button>
        </div>
    </div>

    <!-- Competition Mode Game -->
    <div id="competitionGameContainer" class="game-container hidden">
        <div class="game-header">
            <button class="back-btn" onclick="exitGame()"><i class="fas fa-times"></i></button>
            <h1>Tournament Arena</h1>
            <div class="mode-badge">Competition Mode</div>
        </div>

        <div id="competitionGameArea" class="competition-game-content">
            <div class="tournament-bracket" id="tournamentBracket"></div>
            
            <div class="competition-game-area">
                <div class="match-info">
                    <h3 id="matchTitle"></h3>
                    <div class="match-stats">
                        <span id="matchScore1"></span>
                        <span class="vs">vs</span>
                        <span id="matchScore2"></span>
                    </div>
                </div>

                <div class="game-board" id="competitionGameBoard"></div>

                <div class="match-controls">
                    <button id="nextRoundBtn" class="next-round-btn hidden" onclick="nextCompetitionRound()">
                        <i class="fas fa-arrow-right"></i> Next Match
                    </button>
                </div>
            </div>
        </div>

        <div id="tournamentResults" class="tournament-results hidden">
            <h2>🏆 Tournament Results</h2>
            <div id="resultsContent"></div>
            <button class="start-btn" onclick="backToMode()">
                <i class="fas fa-home"></i> Return to Menu
            </button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
