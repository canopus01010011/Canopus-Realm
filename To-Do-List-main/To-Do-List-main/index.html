<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit — Tasks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="starfield"></canvas>

    <div class="app-shell">

        <header class="app-header">
            <div class="brand">
                <span class="brand-mark"><i class="fas fa-check"></i></span>
                <div>
                    <h1>Orbit</h1>
                    <p class="brand-sub">your tasks, in one gravity well</p>
                </div>
            </div>
            <div class="account-chip" id="accountChip">
                <span class="account-dot" id="accountDot"></span>
                <span id="accountLabel">Checking session…</span>
            </div>
        </header>

        <div class="guest-banner" id="guestBanner" hidden>
            <i class="fas fa-circle-info"></i>
            <span>You're browsing as a guest — tasks are saved on this device only. Log in from the Realm home page to
                sync them to your account.</span>
        </div>

        <section class="stats-row" id="statsRow">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statPending">0</span>
                <span class="stat-label">Pending</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statDone">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat-card progress-card">
                <div class="progress-ring-wrap">
                    <svg viewBox="0 0 64 64" class="progress-ring">
                        <circle cx="32" cy="32" r="27" class="progress-track"></circle>
                        <circle cx="32" cy="32" r="27" class="progress-value" id="progressCircle"></circle>
                    </svg>
                    <span id="progressPercent">0%</span>
                </div>
                <span class="stat-label">Cleared</span>
            </div>
        </section>

        <section class="composer">
            <div class="composer-row">
                <input type="text" id="new-task" placeholder="What needs to get done?" maxlength="140">
                <input type="date" id="task-date">
            </div>
            <div class="composer-row composer-row-secondary">
                <div class="priority-select" id="prioritySelect">
                    <button type="button" class="priority-opt" data-priority="low">Low</button>
                    <button type="button" class="priority-opt active" data-priority="medium">Medium</button>
                    <button type="button" class="priority-opt" data-priority="high">High</button>
                </div>
                <input type="text" id="task-tag" placeholder="Tag (optional, e.g. work)" maxlength="24">
                <button id="add-task"><i class="fas fa-plus"></i> Add task</button>
            </div>
        </section>

        <section class="toolbar">
            <div class="view-tabs" id="viewTabs">
                <button class="view-tab active" data-view="upcoming">Upcoming</button>
                <button class="view-tab" data-view="today">Today</button>
                <button class="view-tab" data-view="all">All</button>
                <button class="view-tab" data-view="completed">Completed</button>
            </div>
            <div class="toolbar-actions">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search tasks…">
                </div>
                <button id="clear-all" title="Clear all tasks"><i class="fas fa-trash"></i></button>
            </div>
        </section>

        <main id="task-list" class="task-list"></main>

        <div class="empty-state" id="emptyState" hidden>
            <div class="empty-orb"></div>
            <h3>Nothing here yet</h3>
            <p id="emptyStateText">Add your first task above and it'll drift into view.</p>
        </div>

    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
